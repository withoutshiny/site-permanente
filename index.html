<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIN DECODER</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:15px}
h1{text-align:center;border:1px solid #0f0;padding:10px}
textarea{width:100%;background:#111;color:#0f0;border:1px solid #0f0;padding:10px;min-height:110px}
button{background:#000;color:#0f0;border:1px solid #0f0;padding:8px;margin:4px;cursor:pointer}
button:hover{background:#0f0;color:#000}
.card{border:1px solid #0f0;padding:12px;margin:15px 0}
</style>
</head>
<body>
<h1>BIN DECODER - withoutshiny</h1>
<div class="card">
<b>BINARIO -> TEXTO</b><br><br>
<textarea id="bin" placeholder="01001000 01100101 01101100 01101100 01101111"></textarea><br>
<button onclick="decode()">DECODE</button>
<button onclick="bugBin()" style="color:red;border-color:red">BUG IT</button><br><br>
<textarea id="txt" readonly placeholder="resultado..."></textarea>
<div id="status"></div>
</div>
<div class="card">
<b>TEXTO -> BINARIO</b><br><br>
<textarea id="txt2" placeholder="Hello"></textarea><br>
<button onclick="encode()">ENCODE</button><br><br>
<textarea id="bin2" readonly></textarea>
</div>
<script>
function decode(){
let b=document.getElementById('bin').value.replace(/[^01]/g,'');
let r='';let e=0;
if(b.length%8!=0){document.getElementById('status').innerHTML='BUG: '+b.length+' bits não é multiplo de 8';}
for(let i=0;i<b.length;i+=8){
let c=b.slice(i,i+8);if(c.length<8){e++;continue}
r+=String.fromCharCode(parseInt(c,2));
}
document.getElementById('txt').value=r;
}
function encode(){
let t=document.getElementById('txt2').value;
let o=[];for(let i=0;i<t.length;i++)o.push(t.charCodeAt(i).toString(2).padStart(8,'0'));
document.getElementById('bin2').value=o.join(' ');
}
function bugBin(){
let pays=["0100100","01001000 00 02 99","0".repeat(4000),"11111111 11111111"];
document.getElementById('bin').value=pays[Math.floor(Math.random()*pays.length)];
decode();
}
</script>
</body>
</html>
